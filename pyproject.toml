[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-evaluator"
version = "0.1.0"
description = "A supervisor-routed multi-agent system that evaluates API documentation, with a tiered guardrail layer and per-run cost/latency accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
doc-evaluator = "doc_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_evaluator = ["guardrails/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
