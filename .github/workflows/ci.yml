name: CI

# Push is scoped to main deliberately. Listing feature branches here as well
# makes every commit on an open PR run the whole workflow twice — once for the
# push and once for the pull_request — because the two events land in different
# concurrency groups and cannot cancel each other. That is double the minutes
# and ten check runs where five belong.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow reads code and runs tests. It has no business holding a write
# token — same least-privilege reasoning the project's own guardrail policy uses.
permissions:
  contents: read

# A second push should supersede the first, not race it to report on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs with no credentials on purpose. The system falls back to
  # replayed model responses when no key is present, so a green run here is
  # evidence for the README's central claim: this works offline.
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,ui]"

      - name: Ruff
        run: ruff check src tests benchmarks scripts ui

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11", so CI covers the range
        # it advertises rather than only the version this was developed on.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,ui]"

      - name: Pytest
        run: pytest -q

  smoke:
    name: smoke (end-to-end, no API key)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,ui]"

      # The unit suite imports modules directly and so cannot catch a broken
      # console script — an earlier commit on this branch shipped a dangling
      # import in cli.py that no test touched. This drives the installed entry
      # point in a subprocess and asserts on the values it returns.
      - name: Smoke
        run: python scripts/smoke.py
